[project]
name = "grad-school-agent"
version = "0.1.0"
description = "申研选校预约系统 — 多 Agent + Hybrid RAG + Streamlit"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "xiaowenhao404" }]
license = { text = "MIT" }

dependencies = [
    # LLM & Agent
    "openai>=1.30.0",            # DeepSeek 兼容 OpenAI SDK
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",

    # RAG
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",  # 可选：本地 BGE embedding

    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.13",                 # schema migration（可选）
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Document loading
    "pypdf>=4.3",
    "markitdown>=0.0.1a3",

    # Frontend
    "streamlit>=1.36",

    # External tools
    "requests>=2.32",
    "httpx>=0.27",

    # Utils
    "tenacity>=8.5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # 行长已用 line-length 控制

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
