[project]
name = "grad-school-agent"
version = "0.1.0"
description = "申研选校预约系统 — 多 Agent + Hybrid RAG + Flask"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "xiaowenhao404" }]
license = { text = "MIT" }

dependencies = [
    # LLM & Agent
    "openai>=1.30.0",            # DeepSeek 兼容 OpenAI SDK
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",  # RecursiveCharacterTextSplitter
    "langgraph>=0.2.0",

    # RAG
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",                 # BM25 稀疏检索的中文分词
    "numpy>=1.26",                   # BM25 打分排序
    "sentence-transformers>=3.0.0",  # 可选：本地 BGE embedding

    # Data
    "sqlalchemy>=2.0",
    "alembic>=1.13",                 # schema migration（可选）
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",

    # Document loading
    "pypdf>=4.3",
    "markitdown>=0.0.1a3",

    # Frontend（Flask + Waitress，已替代旧的 Streamlit 多页面设计）
    "flask>=3.0",
    "waitress>=3.0",

    # External tools
    "requests>=2.32",
    "httpx>=0.27",

    # MCP（标准 MCP Server，见 src/mcp_server/；2.x 里 FastMCP 已更名为 MCPServer）
    "mcp>=2.2.0",

    # Utils
    "tenacity>=8.5",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# 中文路径下不把项目自身装成「可编辑包」：否则 uv 生成的 .pth 会写入中文路径，
# Python 3.11 在 Windows 上用 GBK 读取 .pth 会触发 UnicodeDecodeError 导致解释器无法启动。
# 从项目根目录运行（uv run python app.py）时，`import src.*` 由当前工作目录提供，无需安装本包。
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]  # 行长已用 line-length 控制

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
